# The URL the site will be built for
base_url = "https://johannes.schrott.onl"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

theme = "linkita"
default_language = "en"
author = "johannesschrott"
output_dir = "public"
title = "Johannes Schrott"
generate_feeds = true
feed_filenames = ["atom.xml"] # or ["rss.xml"]
preserve_dotfiles_in_output = false
minify_html = true

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
#highlight_code = true
bottom_footnotes = true


[extra]
# Put all your custom variables here
math = true
mermaid = true
comment = false
title_seperator = " - "
use_cdn = false
copyright = "$YEAR Johannes Schrott"
header_menu_name = "menu"
toc= false

[extra.languages.en]
locale = "en_US"

[extra.menus]
menu = [
#  { url = "@base/pages/archive/", name = "Archive" },
#  { url = "@base/categories", name = "Categories" },
#  { url = "@base/tags/", name = "Tags" },
#  { url = "@base/", name = "Home" },
  { url = "@base/about/", name = "About me" },
  { url = "@base/posts/", name = "Posts" },

]

